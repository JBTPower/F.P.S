[project]
name = "capstone-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JBT Power", email = "jeremy.tschurtschenthaler@outlook.com" }
]
requires-python = ">=3.9"
dependencies = [
    "python-docx>=0.8.11",
    "openai>=1.0.0",
    "PyPDF2>=3.0.0",
    "streamlit>=1.28.0",
    "streamlit-lottie",
    "requests"
]

[project.scripts]
capstone-project = "capstone_project:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
